name: ammar-ai
services:
  app:
    build: .
    image: ammar-ai:local
    pull_policy: never
    restart: unless-stopped
    init: true
    user: "${LOCALAI_UID:-1000}:${LOCALAI_GID:-1000}"
    env_file: .env
    environment:
      DATABASE_PATH: /data/localai.sqlite3
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    mem_limit: 512m
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; u=os.environ['APP_ORIGIN']; r=urllib.request.Request('http://127.0.0.1:8000/',headers={'Host':urllib.parse.urlsplit(u).netloc}); urllib.request.urlopen(r,timeout=3).read(1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
